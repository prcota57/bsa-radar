<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BSA Radar</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #0b1f14; color: #eafff0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------- Tela de nível ---------- */
  #levelScreen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 24px; text-align: center;
  }
  #levelScreen h1 { font-size: 26px; margin: 0 0 4px; }
  #levelScreen p { color: #9fc9ab; margin: 0 0 12px; font-size: 15px; }
  .levelBtn {
    width: 100%; max-width: 340px; padding: 22px; border-radius: 18px; border: none;
    font-size: 20px; font-weight: 700; color: #fff; cursor: pointer;
  }
  .levelBtn small { display:block; font-weight:400; font-size:13px; opacity:.85; margin-top:4px; }
  #btnIniciante { background: linear-gradient(135deg,#2e9e57,#1c6e3b); }
  #btnIntermediario { background: linear-gradient(135deg,#d19a24,#a86c10); }
  #btnAvancado { background: linear-gradient(135deg,#c0392b,#8e2317); }

  /* ---------- Tela principal ---------- */
  #mainScreen { flex: 1; display: none; flex-direction: column; }
  #topBar {
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  }
  .pill { background: rgba(255,255,255,0.08); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; }
  #trocarNivel { background: rgba(255,255,255,0.08); border: none; color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 13px; }

  #centerStage {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; gap: 18px; text-align: center;
  }
  #micIcon {
    width: 140px; height: 140px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 56px; background: radial-gradient(circle, rgba(33,224,101,0.25), rgba(33,224,101,0.02));
    border: 3px solid #21e065; transition: transform .15s ease;
  }
  #micIcon.pulse { transform: scale(1.08); box-shadow: 0 0 40px rgba(33,224,101,0.5); }
  #statusText { font-size: 17px; color: #9fc9ab; min-height: 24px; }
  #lastReading { font-size: 16px; min-height: 50px; }
  #lastReading b { font-size: 30px; display:block; margin-bottom:2px; }
  #transcriptDebug { font-size: 12px; color: #5f8a6d; min-height: 16px; }

  #bottomBar {
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }
  button.action { padding: 16px; border-radius: 14px; border: none; font-size: 17px; font-weight: 700; color: #fff; }
  #btnListen { background: #21e065; color: #06180d; }
  #btnListen.stop { background: #c0392b; color: #fff; }
  #hint { font-size: 12px; color: #7fa98c; text-align: center; }
</style>
</head>
<body>
<div id="app">

  <!-- Seleção de nível -->
  <div id="levelScreen">
    <h1>📡 BSA Radar</h1>
    <p>Escolha o nível da turma antes de começar</p>
    <button class="levelBtn" id="btnIniciante">🟢 Iniciante<small>5–6 anos</small></button>
    <button class="levelBtn" id="btnIntermediario">🟡 Intermediário<small>~8 anos</small></button>
    <button class="levelBtn" id="btnAvancado">🔴 Avançado<small>a partir dos 10-11</small></button>
  </div>

  <!-- Tela principal -->
  <div id="mainScreen">
    <div id="topBar">
      <div class="pill" id="nivelPill">Nível: —</div>
      <button id="trocarNivel">Trocar nível</button>
    </div>
    <div id="centerStage">
      <div id="micIcon">🎤</div>
      <div id="statusText">Toque em "Iniciar" e encoste o celular perto do radar</div>
      <div id="lastReading"></div>
      <div id="transcriptDebug"></div>
    </div>
    <div id="bottomBar">
      <button class="action" id="btnListen">▶️ Iniciar</button>
      <div id="hint">Celular perto do alto-falante do radar · som sai pela caixa Bluetooth</div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------------- Configuração dos níveis ----------------
  const LEVELS = {
    iniciante:      { label: "Iniciante",      breakpoints: [10, 15, 20, 25] },
    intermediario:  { label: "Intermediário",  breakpoints: [20, 30, 40, 50] },
    avancado:       { label: "Avançado",       breakpoints: [35, 45, 60, 75] }
  };
  const PHRASES = [
    "Vamos lá, você consegue!",
    "Continue tentando!",
    "Muito bem!",
    "Excelente!",
    "Uau, sensacional!"
  ];
  let currentLevel = null;

  // ---------------- Áudio ----------------
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const actx = new AudioCtx();
  let palmasBuffer = null;
  let trombetaBuffer = null;
  async function loadSounds(){
    try {
      const resp = await fetch("https://raw.githubusercontent.com/prcota57/bsa-alerta/main/sounds/palmas-simples.wav");
      const arr = await resp.arrayBuffer();
      palmasBuffer = await actx.decodeAudioData(arr);
    } catch(e){ console.warn("Não foi possível carregar som de palmas", e); }
    try {
      const resp2 = await fetch("https://raw.githubusercontent.com/prcota57/bsa-alerta/main/sounds/fail-trombeta.wav");
      const arr2 = await resp2.arrayBuffer();
      trombetaBuffer = await actx.decodeAudioData(arr2);
    } catch(e){ console.warn("Não foi possível carregar som de trombeta", e); }
  }
  loadSounds();

  function playBuffer(buffer, gainValue, rate){
    if(!buffer) return 0;
    const src = actx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = rate || 1;
    const gain = actx.createGain();
    gain.gain.value = gainValue || 1;
    src.connect(gain).connect(actx.destination);
    src.start();
    return buffer.duration / (rate||1);
  }
  function playQuase(){
    const now = actx.currentTime;
    [440, 550].forEach((freq, i) => {
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i*0.14);
      gain.gain.linearRampToValueAtTime(0.18, now + i*0.14 + 0.03);
      gain.gain.linearRampToValueAtTime(0, now + i*0.14 + 0.22);
      osc.connect(gain).connect(actx.destination);
      osc.start(now + i*0.14);
      osc.stop(now + i*0.14 + 0.25);
    });
    return 0.45;
  }
  function playFanfarra(){
    const now = actx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      const t0 = now + i*0.11;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.28, t0 + 0.02);
      gain.gain.linearRampToValueAtTime(0, t0 + 0.35);
      osc.connect(gain).connect(actx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.4);
    });
    return notes.length*0.11 + 0.4;
  }
  function speak(text){
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "pt-BR";
      u.rate = 1.0;
      const voices = speechSynthesis.getVoices();
      const ptVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("pt"));
      if (ptVoice) u.voice = ptVoice;
      speechSynthesis.speak(u);
    } catch(e){ console.warn(e); }
  }

  function getTier(speed, level){
    const bp = LEVELS[level].breakpoints;
    if (speed < bp[0]) return 0;
    if (speed < bp[1]) return 1;
    if (speed < bp[2]) return 2;
    if (speed < bp[3]) return 3;
    return 4;
  }

  const lastReading = document.getElementById("lastReading");
  async function triggerFeedback(speed){
    if (!currentLevel) return;
    const tier = getTier(speed, currentLevel);

    // garante que o áudio de saída está ativo (iOS às vezes suspende o contexto
    // de áudio enquanto o microfone do reconhecimento de fala está ligado)
    try { await actx.resume(); } catch(e){}
    // pausa o microfone bem na hora de tocar som/fala, pra evitar disputa entre
    // entrada (mic) e saída (som) de áudio no iOS; ele reinicia sozinho pelo onend
    if (recognition && listening){ try { recognition.stop(); } catch(e){} }

    let soundDuration = 0;
    if (tier === 0) soundDuration = playBuffer(trombetaBuffer, 1, 1);
    else if (tier === 1) soundDuration = 0;
    else if (tier === 2) soundDuration = playBuffer(palmasBuffer, 1, 1);
    else if (tier === 3) soundDuration = playBuffer(palmasBuffer, 1.3, 1.08);
    else if (tier === 4) { soundDuration = playFanfarra(); playBuffer(palmasBuffer, 1.2, 1); }
    const falaCompleta = `${speed} quilômetros por hora! ${PHRASES[tier]}`;
    setTimeout(() => speak(falaCompleta), Math.max(soundDuration*1000, 0) + 120);
    lastReading.innerHTML = `<b>${speed} km/h</b>${PHRASES[tier]}`;
  }

  // ---------------- Parser de números em inglês ----------------
  const WORD_NUM = {
    zero:0, oh:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9,
    ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16,
    seventeen:17, eighteen:18, nineteen:19,
    twenty:20, thirty:30, forty:40, fourty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90,
    hundred:100
  };

  const UNIT_WORDS = new Set(["kph","kmh","km","kilometers","kilometer","per","hour","hours","mph","miles","mile","and","a"]);

  function parseSpeedFromText(text){
    const clean = text.toLowerCase().replace(/[^a-z0-9\s]/g,"").trim();
    if (!clean) return null;
    const words = clean.split(/\s+/);
    if (words.length > 6) return null; // frase longa demais, provavelmente não é o radar

    // só aceita se TODAS as palavras forem número (dígito ou palavra numérica) ou palavra de unidade
    // isso ignora falas de crianças, música e outros ruídos que não sejam só "o número"
    for (const w of words){
      const isDigit = /^\d+$/.test(w);
      if (!isDigit && !(w in WORD_NUM) && !UNIT_WORDS.has(w)) return null;
    }

    // 1) tenta achar dígitos diretos, ex: "50"
    const digitMatch = clean.match(/\d+/);
    if (digitMatch){
      const v = parseInt(digitMatch[0], 10);
      if (v >= 0 && v <= 150) return v;
    }

    // 2) tenta compor a partir de palavras numéricas em inglês
    let current = 0, found = false;
    for (const w of words){
      if (w in WORD_NUM){
        found = true;
        const val = WORD_NUM[w];
        if (val === 100){ current = (current || 1) * 100; }
        else { current += val; }
      }
    }
    if (found && current >= 0 && current <= 150) return current;
    return null;
  }

  // ---------------- Navegação de tela ----------------
  const levelScreen = document.getElementById("levelScreen");
  const mainScreen = document.getElementById("mainScreen");
  const nivelPill = document.getElementById("nivelPill");
  const statusText = document.getElementById("statusText");
  const transcriptDebug = document.getElementById("transcriptDebug");
  const micIcon = document.getElementById("micIcon");

  function chooseLevel(key){
    currentLevel = key;
    nivelPill.textContent = "Nível: " + LEVELS[key].label;
    levelScreen.style.display = "none";
    mainScreen.style.display = "flex";
  }
  document.getElementById("btnIniciante").onclick = () => chooseLevel("iniciante");
  document.getElementById("btnIntermediario").onclick = () => chooseLevel("intermediario");
  document.getElementById("btnAvancado").onclick = () => chooseLevel("avancado");
  document.getElementById("trocarNivel").onclick = () => {
    stopListening();
    mainScreen.style.display = "none";
    levelScreen.style.display = "flex";
  };

  // ---------------- Reconhecimento de fala ----------------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let shouldKeepListening = false;
  let lastTriggered = null;
  let cooldownUntil = 0;
  let restartCount = 0;
  let sessionStartedAt = 0;

  const btnListen = document.getElementById("btnListen");

  function setupRecognition(){
    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = true; // pega o resultado ainda "no meio", antes de fechar a frase

    recognition.onstart = () => {
      listening = true;
      sessionStartedAt = Date.now();
      micIcon.classList.add("pulse");
      statusText.textContent = "Ouvindo o radar...";
    };

    recognition.onresult = (event) => {
      // varre todos os resultados novos (parciais e finais) desde o último índice processado
      for (let i = event.resultIndex; i < event.results.length; i++){
        const text = event.results[i][0].transcript;
        transcriptDebug.textContent = 'Ouvi: "' + text + '"';
        const value = parseSpeedFromText(text);
        const now = Date.now();
        if (value !== null && now >= cooldownUntil){
          cooldownUntil = now + 1500;
          lastTriggered = value;
          triggerFeedback(value);
        }
      }
    };

    recognition.onerror = (e) => {
      transcriptDebug.textContent = "Erro no reconhecimento: " + e.error;
      // 'no-speech' é normal (silêncio entre passagens); outros erros só ficam registrados,
      // o onend cuida de reiniciar de qualquer forma
    };

    recognition.onend = () => {
      listening = false;
      micIcon.classList.remove("pulse");
      if (shouldKeepListening){
        restartCount++;
        // a cada 20 reinícios (ou sessão com mais de 3 min), recria o objeto do zero —
        // ajuda a evitar degradação do reconhecimento em uso contínuo por muito tempo
        if (restartCount >= 20 || (Date.now() - sessionStartedAt) > 180000){
          restartCount = 0;
          setupRecognition();
        }
        safeStart();
      }
    };
  }

  function safeStart(){
    try { recognition.start(); }
    catch(e){ setTimeout(() => { try { recognition.start(); } catch(e2){} }, 250); }
  }

  // ---------------- Wake Lock (impede a tela de bloquear/economizar energia) ----------------
  let wakeLock = null;
  async function requestWakeLock(){
    try {
      if ("wakeLock" in navigator){
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch(e){ console.warn("Wake lock falhou:", e); }
  }
  document.addEventListener("visibilitychange", async () => {
    // a trava é liberada automaticamente quando a tela apaga; pede de novo ao voltar
    if (shouldKeepListening && document.visibilityState === "visible" && !wakeLock){
      await requestWakeLock();
      if (!listening) safeStart();
    }
  });

  async function startListening(){
    if (!SpeechRecognition){
      alert("Este navegador não suporta reconhecimento de fala. Use o Safari no iPhone.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop());
    } catch(e){
      alert("Preciso da permissão do microfone pra funcionar.");
      return;
    }
    await requestWakeLock();
    if (!recognition) setupRecognition();
    shouldKeepListening = true;
    safeStart();
    btnListen.textContent = "⏸️ Parar";
    btnListen.classList.add("stop");
  }

  function stopListening(){
    shouldKeepListening = false;
    if (recognition) { try { recognition.stop(); } catch(e){} }
    if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
    micIcon.classList.remove("pulse");
    statusText.textContent = 'Toque em "Iniciar" e encoste o celular perto do radar';
    btnListen.textContent = "▶️ Iniciar";
    btnListen.classList.remove("stop");
  }

  btnListen.onclick = () => { shouldKeepListening ? stopListening() : startListening(); };

  // desbloqueia a síntese de voz e o áudio no iOS (precisa de interação do usuário)
  document.body.addEventListener("touchstart", function unlock(){
    speechSynthesis.speak(new SpeechSynthesisUtterance(""));
    actx.resume();
    document.body.removeEventListener("touchstart", unlock);
  }, {once:true});

})();
</script>
</body>
</html>
