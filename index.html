<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BSA Radar</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #0b1f14; color: #eafff0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------- Tela de nível ---------- */
  #levelScreen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 24px; text-align: center;
  }
  #levelScreen h1 { font-size: 24px; margin: 0 0 4px; }
  #levelScreen p { color: #9fc9ab; margin: 0 0 12px; font-size: 15px; }
  .levelBtn {
    width: 100%; max-width: 340px; padding: 22px; border-radius: 18px; border: none;
    font-size: 20px; font-weight: 700; color: #fff; cursor: pointer;
  }
  .levelBtn small { display:block; font-weight:400; font-size:13px; opacity:.85; margin-top:4px; }
  #btnIniciante { background: linear-gradient(135deg,#2e9e57,#1c6e3b); }
  #btnIntermediario { background: linear-gradient(135deg,#d19a24,#a86c10); }
  #btnAvancado { background: linear-gradient(135deg,#c0392b,#8e2317); }

  /* ---------- Tela principal ---------- */
  #mainScreen { flex: 1; display: none; flex-direction: column; position: relative; }
  #camWrap { flex: 1; position: relative; overflow: hidden; background: #000; }
  video { width: 100%; height: 100%; object-fit: cover; }

  #roiBox {
    position: absolute; border: 3px solid #21e065; border-radius: 8px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
    touch-action: none;
  }
  .handle {
    position: absolute; width: 26px; height: 26px; background: #21e065; border-radius: 50%;
    border: 3px solid #0b1f14; touch-action: none;
  }
  #h-nw { top:-13px; left:-13px; } #h-ne { top:-13px; right:-13px; }
  #h-sw { bottom:-13px; left:-13px; } #h-se { bottom:-13px; right:-13px; }

  #topBar {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: center; padding: 10px 12px; z-index: 5;
  }
  .pill {
    background: rgba(0,0,0,0.55); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
  }
  #trocarNivel { background: rgba(0,0,0,0.55); border: none; color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 13px; }

  #readingBar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
    background: rgba(8,20,13,0.92); padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }
  #lastReading { font-size: 15px; text-align: center; color: #9fc9ab; min-height: 20px; }
  #lastReading b { color: #fff; font-size: 22px; }

  .row { display: flex; gap: 10px; }
  button.action {
    flex: 1; padding: 14px; border-radius: 14px; border: none; font-size: 16px; font-weight: 700; color: #fff;
  }
  #btnStart { background: #21e065; color: #06180d; }
  #btnStart.stop { background: #c0392b; color: #fff; }
  #btnManual { background: #2b3d33; }

  #manualPanel {
    display: none; gap: 10px; align-items: center;
  }
  #manualPanel input {
    flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 18px; text-align: center;
  }
  #manualPanel button { padding: 12px 18px; border-radius: 12px; border: none; background:#21e065; font-weight:700; }

  #hint { font-size: 12px; color: #7fa98c; text-align: center; }
</style>
</head>
<body>
<div id="app">

  <!-- Seleção de nível -->
  <div id="levelScreen">
    <h1>📡 BSA Radar</h1>
    <p>Escolha o nível da turma antes de começar</p>
    <button class="levelBtn" id="btnIniciante">🟢 Iniciante<small>5–6 anos</small></button>
    <button class="levelBtn" id="btnIntermediario">🟡 Intermediário<small>~8 anos</small></button>
    <button class="levelBtn" id="btnAvancado">🔴 Avançado<small>a partir dos 10-11</small></button>
  </div>

  <!-- Tela principal -->
  <div id="mainScreen">
    <div id="camWrap">
      <video id="video" autoplay playsinline muted></video>
      <div id="roiBox">
        <div class="handle" id="h-nw"></div>
        <div class="handle" id="h-ne"></div>
        <div class="handle" id="h-sw"></div>
        <div class="handle" id="h-se"></div>
      </div>
      <div id="topBar">
        <div class="pill" id="nivelPill">Nível: —</div>
        <button id="trocarNivel">Trocar nível</button>
      </div>
    </div>
    <div id="readingBar">
      <div id="lastReading">Ajuste a caixa verde sobre o número do radar e toque em Iniciar leitura</div>
      <div class="row">
        <button class="action" id="btnStart">▶️ Iniciar leitura</button>
        <button class="action" id="btnManual">⌨️ Digitar</button>
      </div>
      <div id="manualPanel">
        <input type="number" id="manualInput" placeholder="km/h" inputmode="numeric">
        <button id="manualGo">OK</button>
      </div>
      <div id="hint">Celular fixo no tripé apontando pro visor do radar</div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------------- Configuração dos níveis ----------------
  // breakpoints = [b0,b1,b2,b3] definem 5 faixas: <b0, b0-b1, b1-b2, b2-b3, >b3
  const LEVELS = {
    iniciante:      { label: "Iniciante",      breakpoints: [10, 15, 20, 25] },
    intermediario:  { label: "Intermediário",  breakpoints: [20, 30, 40, 50] },
    avancado:       { label: "Avançado",       breakpoints: [35, 45, 60, 75] }
  };

  const PHRASES = [
    "Vamos lá, você consegue!",
    "Continue tentando!",
    "Muito bem!",
    "Excelente!",
    "Uau, sensacional!"
  ];

  let currentLevel = null;

  // ---------------- Áudio ----------------
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const actx = new AudioCtx();
  let palmasBuffer = null;

  async function loadPalmas(){
    try {
      const resp = await fetch("https://raw.githubusercontent.com/prcota57/bsa-alerta/main/sounds/palmas-simples.wav");
      const arr = await resp.arrayBuffer();
      palmasBuffer = await actx.decodeAudioData(arr);
    } catch(e){ console.warn("Não foi possível carregar som de palmas", e); }
  }
  loadPalmas();

  function playBuffer(buffer, gainValue, rate){
    if(!buffer) return 0;
    const src = actx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = rate || 1;
    const gain = actx.createGain();
    gain.gain.value = gainValue || 1;
    src.connect(gain).connect(actx.destination);
    src.start();
    return buffer.duration / (rate||1);
  }

  // som leve tipo "quase" - dois tons suaves ascendentes
  function playQuase(){
    const now = actx.currentTime;
    [440, 550].forEach((freq, i) => {
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i*0.14);
      gain.gain.linearRampToValueAtTime(0.18, now + i*0.14 + 0.03);
      gain.gain.linearRampToValueAtTime(0, now + i*0.14 + 0.22);
      osc.connect(gain).connect(actx.destination);
      osc.start(now + i*0.14);
      osc.stop(now + i*0.14 + 0.25);
    });
    return 0.45;
  }

  // fanfarra ascendente pra comemoração
  function playFanfarra(){
    const now = actx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C E G C
    notes.forEach((freq, i) => {
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      const t0 = now + i*0.11;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.28, t0 + 0.02);
      gain.gain.linearRampToValueAtTime(0, t0 + 0.35);
      osc.connect(gain).connect(actx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.4);
    });
    return notes.length*0.11 + 0.4;
  }

  function speak(text){
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "pt-BR";
      u.rate = 1.0;
      const voices = speechSynthesis.getVoices();
      const ptVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("pt"));
      if (ptVoice) u.voice = ptVoice;
      speechSynthesis.speak(u);
    } catch(e){ console.warn(e); }
  }

  function getTier(speed, level){
    const bp = LEVELS[level].breakpoints;
    if (speed < bp[0]) return 0;
    if (speed < bp[1]) return 1;
    if (speed < bp[2]) return 2;
    if (speed < bp[3]) return 3;
    return 4;
  }

  function triggerFeedback(speed){
    if (!currentLevel) return;
    const tier = getTier(speed, currentLevel);
    let soundDuration = 0;
    if (tier === 0) soundDuration = playQuase();
    else if (tier === 1) soundDuration = 0;
    else if (tier === 2) soundDuration = playBuffer(palmasBuffer, 1, 1);
    else if (tier === 3) soundDuration = playBuffer(palmasBuffer, 1.3, 1.08);
    else if (tier === 4) { soundDuration = playFanfarra(); playBuffer(palmasBuffer, 1.2, 1); }

    setTimeout(() => speak(PHRASES[tier]), Math.max(soundDuration*1000, 0) + 120);

    lastReading.innerHTML = `Última leitura: <b>${speed} km/h</b> — ${PHRASES[tier]}`;
  }

  // ---------------- Navegação de tela ----------------
  const levelScreen = document.getElementById("levelScreen");
  const mainScreen = document.getElementById("mainScreen");
  const nivelPill = document.getElementById("nivelPill");
  const lastReading = document.getElementById("lastReading");

  function chooseLevel(key){
    currentLevel = key;
    nivelPill.textContent = "Nível: " + LEVELS[key].label;
    levelScreen.style.display = "none";
    mainScreen.style.display = "flex";
    startCamera();
  }

  document.getElementById("btnIniciante").onclick = () => chooseLevel("iniciante");
  document.getElementById("btnIntermediario").onclick = () => chooseLevel("intermediario");
  document.getElementById("btnAvancado").onclick = () => chooseLevel("avancado");
  document.getElementById("trocarNivel").onclick = () => {
    stopReading();
    mainScreen.style.display = "none";
    levelScreen.style.display = "flex";
  };

  // ---------------- Câmera ----------------
  const video = document.getElementById("video");
  async function startCamera(){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
    } catch(e){
      alert("Não consegui acessar a câmera. Verifique a permissão do navegador.");
      console.error(e);
    }
  }

  // ---------------- Caixa arrastável (ROI) ----------------
  const roiBox = document.getElementById("roiBox");
  const camWrap = document.getElementById("camWrap");

  function setRoiDefault(){
    const w = camWrap.clientWidth, h = camWrap.clientHeight;
    const bw = w * 0.55, bh = h * 0.22;
    roiBox.style.left = (w-bw)/2 + "px";
    roiBox.style.top = (h-bh)/2 + "px";
    roiBox.style.width = bw + "px";
    roiBox.style.height = bh + "px";
  }
  window.addEventListener("resize", setRoiDefault);
  setTimeout(setRoiDefault, 300);

  function enableDrag(el, onMove){
    let startX, startY, startRect;
    el.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      startRect = { left: roiBox.offsetLeft, top: roiBox.offsetTop, width: roiBox.offsetWidth, height: roiBox.offsetHeight };
      e.stopPropagation();
    }, {passive:true});
    el.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      const dx = t.clientX - startX, dy = t.clientY - startY;
      onMove(dx, dy, startRect);
      e.preventDefault(); e.stopPropagation();
    }, {passive:false});
  }

  // mover a caixa inteira
  enableDrag(roiBox, (dx, dy, r) => {
    const maxLeft = camWrap.clientWidth - r.width;
    const maxTop = camWrap.clientHeight - r.height;
    roiBox.style.left = Math.min(Math.max(0, r.left+dx), maxLeft) + "px";
    roiBox.style.top = Math.min(Math.max(0, r.top+dy), maxTop) + "px";
  });

  function enableCornerDrag(id, corner){
    const handle = document.getElementById(id);
    enableDrag(handle, (dx, dy, r) => {
      let {left, top, width, height} = r;
      if (corner.includes("e")) width = Math.max(60, r.width + dx);
      if (corner.includes("s")) height = Math.max(30, r.height + dy);
      if (corner.includes("w")) { width = Math.max(60, r.width - dx); left = r.left + (r.width - width); }
      if (corner.includes("n")) { height = Math.max(30, r.height - dy); top = r.top + (r.height - height); }
      roiBox.style.left = left + "px";
      roiBox.style.top = top + "px";
      roiBox.style.width = width + "px";
      roiBox.style.height = height + "px";
    });
  }
  enableCornerDrag("h-nw","nw");
  enableCornerDrag("h-ne","ne");
  enableCornerDrag("h-sw","sw");
  enableCornerDrag("h-se","se");

  // ---------------- OCR loop ----------------
  let worker = null;
  let reading = false;
  let loopTimer = null;
  let candidateValue = null;
  let candidateCount = 0;
  let lastTriggered = null;
  let cooldownUntil = 0;

  const btnStart = document.getElementById("btnStart");

  async function ensureWorker(){
    if (worker) return worker;
    worker = await Tesseract.createWorker("eng");
    await worker.setParameters({
      tessedit_char_whitelist: "0123456789",
      tessedit_pageseg_mode: "7"
    });
    return worker;
  }

  function captureRoiCanvas(){
    const wrapRect = camWrap.getBoundingClientRect();
    const scaleX = video.videoWidth / wrapRect.width;
    const scaleY = video.videoHeight / wrapRect.height;
    const bx = roiBox.offsetLeft * scaleX;
    const by = roiBox.offsetTop * scaleY;
    const bw = roiBox.offsetWidth * scaleX;
    const bh = roiBox.offsetHeight * scaleY;
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, bw);
    canvas.height = Math.max(1, bh);
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, bx, by, bw, bh, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  async function ocrLoop(){
    if (!reading) return;
    try {
      const canvas = captureRoiCanvas();
      const w = await ensureWorker();
      const { data } = await w.recognize(canvas);
      const digits = (data.text.match(/\d+/g) || []).join("");
      const value = digits ? parseInt(digits, 10) : null;
      handleReading(value);
    } catch(e){ console.warn("OCR erro", e); }
    loopTimer = setTimeout(ocrLoop, 700);
  }

  function handleReading(value){
    const now = Date.now();
    if (value === null || value <= 0 || value > 150){
      candidateValue = null; candidateCount = 0;
      return;
    }
    if (value === candidateValue){
      candidateCount++;
    } else {
      candidateValue = value; candidateCount = 1;
    }
    if (candidateCount >= 2 && now >= cooldownUntil){
      if (lastTriggered === null || Math.abs(value - lastTriggered) >= 2){
        lastTriggered = value;
        cooldownUntil = now + 3000;
        triggerFeedback(value);
      }
    }
  }

  function startReading(){
    reading = true;
    btnStart.textContent = "⏸️ Parar leitura";
    btnStart.classList.add("stop");
    lastReading.textContent = "Lendo o visor do radar...";
    ocrLoop();
  }
  function stopReading(){
    reading = false;
    if (loopTimer) clearTimeout(loopTimer);
    btnStart.textContent = "▶️ Iniciar leitura";
    btnStart.classList.remove("stop");
  }
  btnStart.onclick = () => { reading ? stopReading() : startReading(); };

  // ---------------- Entrada manual ----------------
  const btnManual = document.getElementById("btnManual");
  const manualPanel = document.getElementById("manualPanel");
  const manualInput = document.getElementById("manualInput");
  document.getElementById("manualGo").onclick = () => {
    const v = parseInt(manualInput.value, 10);
    if (!isNaN(v) && v > 0){
      lastTriggered = v;
      cooldownUntil = Date.now() + 3000;
      triggerFeedback(v);
      manualInput.value = "";
    }
  };
  btnManual.onclick = () => {
    manualPanel.style.display = manualPanel.style.display === "flex" ? "none" : "flex";
  };

  // desbloqueia a síntese de voz no iOS (precisa de interação do usuário)
  document.body.addEventListener("touchstart", function unlock(){
    speechSynthesis.speak(new SpeechSynthesisUtterance(""));
    actx.resume();
    document.body.removeEventListener("touchstart", unlock);
  }, {once:true});

})();
</script>
</body>
</html>
